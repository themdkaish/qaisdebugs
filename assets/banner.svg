<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="400" viewBox="0 0 1280 400" role="img" aria-labelledby="t d">
  <title id="t">qaisdebugs</title>
  <desc id="d">X-ray for Next.js dev servers: server-side network calls, unified logs and server plus client breakpoints.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a0e1a"/>
      <stop offset="1" stop-color="#111827"/>
    </linearGradient>
    <radialGradient id="glowA" cx="0.18" cy="0.35" r="0.55">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="0.9" cy="0.95" r="0.6">
      <stop offset="0" stop-color="#a78bfa" stop-opacity="0.25"/>
      <stop offset="1" stop-color="#a78bfa" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="mark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
    <linearGradient id="word" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f8fafc"/>
      <stop offset="1" stop-color="#c7d2fe"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#ffffff" stroke-opacity="0.045" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1280" height="400" rx="28" fill="url(#bg)"/>
  <rect width="1280" height="400" rx="28" fill="url(#grid)"/>
  <rect width="1280" height="400" rx="28" fill="url(#glowA)"/>
  <rect width="1280" height="400" rx="28" fill="url(#glowB)"/>

  <!-- Mark: a lens over a bug, scanned by an x-ray line -->
  <g transform="translate(118 108)">
    <rect width="184" height="184" rx="44" fill="#0f172a" stroke="url(#mark)" stroke-width="3"/>
    <g fill="none" stroke="url(#mark)" stroke-width="7" stroke-linecap="round" stroke-linejoin="round">
      <ellipse cx="92" cy="98" rx="30" ry="38"/>
      <path d="M92 60v76"/>
      <path d="M62 84H40M62 108H38M66 130l-18 14M122 84h22M122 108h24M118 130l18 14"/>
      <path d="M78 58l-10-16M106 58l10-16"/>
    </g>
    <rect x="22" y="94" width="140" height="6" rx="3" fill="#22d3ee" opacity="0.85"/>
    <rect x="22" y="94" width="140" height="18" rx="9" fill="#22d3ee" opacity="0.12"/>
  </g>

  <g font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif">
    <text x="360" y="176" font-size="76" font-weight="800" letter-spacing="-1.5" fill="url(#word)">qaisdebugs</text>
    <text x="362" y="226" font-size="28" font-weight="500" fill="#cbd5e1">X-ray for Next.js dev servers</text>

    <g font-size="17" font-weight="600">
      <g transform="translate(362 262)">
        <rect width="200" height="38" rx="19" fill="#22d3ee" fill-opacity="0.12" stroke="#22d3ee" stroke-opacity="0.5"/>
        <text x="100" y="25" text-anchor="middle" fill="#67e8f9">Server network calls</text>
      </g>
      <g transform="translate(576 262)">
        <rect width="150" height="38" rx="19" fill="#34d399" fill-opacity="0.12" stroke="#34d399" stroke-opacity="0.5"/>
        <text x="75" y="25" text-anchor="middle" fill="#6ee7b7">Unified logs</text>
      </g>
      <g transform="translate(740 262)">
        <rect width="258" height="38" rx="19" fill="#a78bfa" fill-opacity="0.12" stroke="#a78bfa" stroke-opacity="0.5"/>
        <text x="129" y="25" text-anchor="middle" fill="#c4b5fd">Server + client breakpoints</text>
      </g>
    </g>

    <text x="362" y="336" font-size="18" fill="#94a3b8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">$ npx qaisdebugs dev</text>
  </g>
</svg>
